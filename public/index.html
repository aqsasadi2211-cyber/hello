<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --accent:#2f6fed; --border:#dde2ec; --ok:#1f9d55; --err:#d64545; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    .card { width:100%; max-width:480px; background:var(--card); border-radius:14px; padding:32px;
            box-shadow:0 10px 30px rgba(20,30,60,.08); }
    h1 { margin:0 0 4px; font-size:1.6rem; }
    p.sub { margin:0 0 24px; color:var(--muted); }
    label { display:block; font-size:.9rem; font-weight:600; margin:14px 0 6px; }
    input, textarea { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font:inherit; }
    input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,237,.15); }
    textarea { min-height:130px; resize:vertical; }
    button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .status { margin-top:14px; font-size:.95rem; min-height:1.2em; }
    .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Contact Us</h1>
    <p class="sub">Send us a message and we'll get back to you.</p>

    <label for="name">Name *</label>
    <input id="name" name="name" required>

    <label for="email">Email *</label>
    <input id="email" name="email" type="email" required>

    <label for="subject">Subject</label>
    <input id="subject" name="subject">

    <label for="message">Message *</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit" id="btn">Send Message</button>
    <div class="status" id="status"></div>
  </form>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = "Sending...";
      status.className = "status"; status.textContent = "";
      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        status.className = "status ok"; status.textContent = "Message sent successfully!";
        form.reset();
      } catch (err) {
        status.className = "status err"; status.textContent = err.message || "Something went wrong.";
      } finally {
        btn.disabled = false; btn.textContent = "Send Message";
      }
    });
  </script>
</body>
</html>
